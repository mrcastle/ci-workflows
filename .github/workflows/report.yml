# Reusable: keep one PR comment in sync with this run's results.
# The table comes from the Jobs API (catches setup failures and cancellations too);
# failure details come from the fragments run-check uploads. Never checks out or runs repo code.
#
# Created when something fails; updated on every run once it exists, so it's never stale.

name: report

on:
  workflow_call:

permissions: {}

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # Jobs API
      pull-requests: write # PR comment
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-report-*
          path: ${{ runner.temp }}/ci-report
          merge-multiple: true

      - name: Upsert PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          JOBS_API: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
        run: |
          [[ -n "$PR" ]] || { echo "Not a pull_request run; nothing to report."; exit 0; }
          marker='<!-- ci-workflows:report -->'

          # Finished, non-skipped jobs, minus successful plan jobs. Names look like "ci / lint".
          gh api "$JOBS_API" --paginate --jq '.jobs[]
            | select(.status == "completed" and .conclusion != "skipped")
            | select((.conclusion == "success" and (.name | endswith("/ plan"))) | not)
            | [.name, .conclusion, .html_url] | @tsv' | sort > jobs.tsv
          total=$(wc -l < jobs.tsv)
          failed=$(awk -F'\t' '$2 != "success"' jobs.tsv | wc -l)
          (( total > 0 )) || exit 0

          {
            echo "$marker"
            if (( failed > 0 )); then echo "### ❌ CI: $failed of $total checks failed"
            else echo "### ✅ CI: all $total checks passed"; fi
            echo "Commit \`${SHA:0:7}\` · [workflow run]($RUN)"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            awk -F'\t' '{ printf "| [%s](%s) | %s %s |\n", $1, $3, ($2 == "success" ? "✅" : "❌"), $2 }' jobs.tsv
            echo
            cat "$RUNNER_TEMP"/ci-report/*.md 2>/dev/null || true
          } | head -c 60000 > body.md
          cat body.md >> "$GITHUB_STEP_SUMMARY"

          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@body.md > /dev/null && echo "Updated comment $id"
          elif (( failed > 0 )); then
            gh api "repos/$GH_REPO/issues/$PR/comments" -F body=@body.md > /dev/null && echo "Created comment"
          else
            echo "All passing and no earlier comment; nothing to post."
          fi

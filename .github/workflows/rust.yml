# Reusable CI for a Rust project: plan ─▶ one job per check; security; report. Usage: README.md.

name: rust

on:
  workflow_call:
    inputs:
      checks:
        description: 'One "name: command" per line, e.g. "clippy: cargo clippy --all-targets -- -D warnings". Each becomes its own job.'
        type: string
        required: true
      toolchain:
        description: A rust-toolchain.toml in the repo takes precedence.
        type: string
        default: stable
      working-directory:
        type: string
        default: "."
      timeout-minutes:
        description: Per check job.
        type: number
        default: 15

permissions: {}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - id: plan
        uses: $/actions/plan
        with:
          checks: ${{ inputs.checks }}

  check:
    needs: plan
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - uses: $/actions/rust-setup
        with:
          toolchain: ${{ inputs.toolchain }}
          working-directory: ${{ inputs.working-directory }}
      - uses: $/actions/run-check
        with:
          name: ${{ matrix.name }}
          run: ${{ matrix.run }}
          working-directory: ${{ inputs.working-directory }}

  security:
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/security.yml

  report:
    needs: [plan, check, security]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      actions: read
      pull-requests: write
    uses: $/.github/workflows/report.yml

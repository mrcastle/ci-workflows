name: rust

on:
  workflow_call:
    inputs:
      fmt:
        description: Format check command. Empty skips it.
        type: string
        default: cargo fmt --check
      clippy:
        description: Clippy command. Empty skips it.
        type: string
        default: cargo clippy --all-targets --locked -- -D warnings
      test:
        description: Test command. Empty skips it.
        type: string
        default: cargo test --locked
      toolchain:
        description: Toolchain to install. Ignored when a rust-toolchain.toml pins one.
        type: string
        default: stable
      working-directory:
        description: Project root. The security scans always cover the whole repo.
        type: string
        default: "."
      timeout-minutes:
        description: Time limit for the checks job.
        type: number
        default: 20

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      actions: read # zizmor online audits
    outputs:
      rows: ${{ steps.results.outputs.rows }}
      details: ${{ steps.results.outputs.details }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: security
        uses: $/actions/security

      - id: toolchain
        name: toolchain
        if: ${{ !cancelled() }}
        uses: $/actions/rust-toolchain
        with:
          toolchain: ${{ inputs.toolchain }}
          working-directory: ${{ inputs.working-directory }}

      - if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ${{ inputs.working-directory }}

      - name: fmt
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && inputs.fmt != '' }}
        uses: $/actions/check
        with: { name: fmt, run: "${{ inputs.fmt }}", working-directory: "${{ inputs.working-directory }}" }

      - name: clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && inputs.clippy != '' }}
        uses: $/actions/check
        with: { name: clippy, run: "${{ inputs.clippy }}", working-directory: "${{ inputs.working-directory }}" }

      - name: test
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && inputs.test != '' }}
        uses: $/actions/check
        with: { name: test, run: "${{ inputs.test }}", working-directory: "${{ inputs.working-directory }}" }

      - id: results
        if: ${{ always() }}
        uses: $/actions/results
        with:
          checks: fmt clippy test
          commands: ${{ toJSON(inputs) }}
          setup: ${{ steps.toolchain.outcome }}

  report:
    needs: checks
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: $/actions/comment
        with:
          rows: ${{ needs.checks.outputs.rows }}
          details: ${{ needs.checks.outputs.details }}
          result: ${{ needs.checks.result }}

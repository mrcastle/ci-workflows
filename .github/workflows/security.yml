# Reusable: dependency vulnerabilities (OSV-Scanner), workflow security (zizmor),
# leaked secrets (gitleaks). One job, no dependency install. Usage: README.md.
#
# The osv-scanner and gitleaks binaries are pinned by version + SHA256 below.
# Dependabot can't update these; bump them by hand (see README).

name: security

on:
  workflow_call:
    inputs:
      scan-path:
        description: Directory OSV-Scanner scans recursively for lockfiles.
        type: string
        default: "."

permissions: {}

env:
  OSV_VERSION: 2.7.0
  OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # zizmor online audits on private repos
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks scans commit history

      - name: Install osv-scanner and gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  osv-scanner\n%s  gitleaks.tgz\n' "$OSV_SHA256" "$GITLEAKS_SHA256" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          chmod +x osv-scanner gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: OSV-Scanner
        if: ${{ !cancelled() }}
        env:
          SCAN_PATH: ${{ inputs.scan-path }}
        run: |
          rc=0
          osv-scanner scan source --recursive --format markdown --output-file "$RUNNER_TEMP/osv.md" "$SCAN_PATH" || rc=$?
          touch "$RUNNER_TEMP/osv.md"
          cat "$RUNNER_TEMP/osv.md"
          case $rc in
            0)   echo "### OSV-Scanner: no known vulnerabilities" >> "$GITHUB_STEP_SUMMARY" ;;
            1)   { echo "### OSV-Scanner: vulnerabilities found"; cat "$RUNNER_TEMP/osv.md"; } >> "$GITHUB_STEP_SUMMARY"
                 echo "::error::Vulnerable dependencies found. Upgrade them, or ignore with a reason in osv-scanner.toml."
                 exit 1 ;;
            128) echo "::notice::OSV-Scanner found no lockfiles to scan." ;;
            *)   echo "::error::osv-scanner failed (exit $rc)"; exit "$rc" ;;
          esac

      - name: zizmor
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false # SARIF upload needs paid Advanced Security on private repos
          annotations: true

      # PRs: only the PR's commits. Other events: full history.
      - name: gitleaks
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          range=()
          [[ -n "$BASE" ]] && range=(--log-opts="$BASE..$HEAD")
          gitleaks git --redact --no-banner "${range[@]}" .

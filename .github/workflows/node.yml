# Reusable CI for a Node project. Usage: README.md.
#
#   install ──┬─▶ <check> ─┐
#             └─▶ <check> ─┤
#   security ─▶ osv, zizmor, gitleaks ──▶ report
#
# install runs npm ci once and hands node_modules to the check jobs as a run artifact.

name: node

on:
  workflow_call:
    inputs:
      checks:
        description: 'One "name: command" per line, e.g. "lint: npm run lint". Each becomes its own job.'
        type: string
        required: true
      node-version:
        description: Ignored when node-version-file is set.
        type: string
        default: lts/*
      node-version-file:
        description: File to read the Node version from (e.g. .nvmrc), relative to working-directory.
        type: string
        default: ""
      install-command:
        description: Lifecycle scripts are off by default; drop --ignore-scripts if the project needs them (e.g. Prisma).
        type: string
        default: npm ci --ignore-scripts --no-audit --no-fund
      working-directory:
        type: string
        default: "."
      timeout-minutes:
        description: Per check job.
        type: number
        default: 10

permissions: {}

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - id: plan
        uses: $/actions/plan
        with:
          checks: ${{ inputs.checks }}
      - uses: $/actions/node-setup
        with:
          install: true
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}
          install-command: ${{ inputs.install-command }}
          working-directory: ${{ inputs.working-directory }}

  check:
    needs: install
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.install.outputs.checks) }}
    steps:
      - uses: $/actions/node-setup
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}
          working-directory: ${{ inputs.working-directory }}
      - uses: $/actions/run-check
        with:
          name: ${{ matrix.name }}
          run: ${{ matrix.run }}
          working-directory: ${{ inputs.working-directory }}

  security:
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/security.yml

  report:
    needs: [install, check, security]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      actions: read
      pull-requests: write
    uses: $/.github/workflows/report.yml

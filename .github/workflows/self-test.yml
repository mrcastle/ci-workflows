# CI for this repo, wired exactly like a caller: lint the workflows, run node.yml
# and rust.yml against the fixtures, run security.yml, then report on the PR.

name: self-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint 1.7.12 can't parse GitHub's `$/` self-repository syntax yet
      # (rhysd/actionlint#711); ignore only those two errors.
      - name: actionlint
        run: |
          tgz="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tgz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tgz"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color \
            -ignore 'specifying action "\$/' \
            -ignore 'reusable workflow call "\$/'
      # actionlint doesn't read composite actions; at least make sure they parse.
      - name: actions parse
        run: for f in actions/*/action.yml; do yq e . "$f" > /dev/null || exit 1; done

  node:
    permissions:
      contents: read
    uses: $/.github/workflows/node.yml
    with:
      working-directory: fixtures/node
      node-version-file: .nvmrc
      checks: |
        lint: npm run lint
        test-unit: npm test

  rust:
    permissions:
      contents: read
    uses: $/.github/workflows/rust.yml
    with:
      working-directory: fixtures/rust
      checks: |
        fmt: cargo fmt --check
        clippy: cargo clippy --all-targets --locked -- -D warnings
        test-unit: cargo test --lib --locked
        test-integration: cargo test --test '*' --locked

  security:
    permissions:
      contents: read
      actions: read
    uses: $/.github/workflows/security.yml

  report:
    needs: [actionlint, node, rust, security]
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      actions: read
      pull-requests: write
    uses: $/.github/workflows/report.yml

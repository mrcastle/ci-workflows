name: rust-setup
description: Check out the repo, install a Rust toolchain, restore the build cache.

inputs:
  toolchain:
    description: A rust-toolchain.toml in the repo takes precedence.
    default: stable
  working-directory:
    default: "."

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # rustup is preinstalled on GitHub's Ubuntu runners.
    - name: Install toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy
        rustup default "$TOOLCHAIN"

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ inputs.working-directory }}

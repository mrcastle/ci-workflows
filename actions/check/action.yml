name: check
description: Run one check command and record its result for the PR report.

inputs:
  name:
    description: Check name, shown in the report.
    required: true
  run:
    description: Command, run with bash -euo pipefail.
    required: true
  working-directory:
    description: Directory to run the command in.
    default: "."

runs:
  using: composite
  steps:
    - name: Run check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NAME: ${{ inputs.name }}
        RUN: ${{ inputs.run }}
      run: bash "$GITHUB_ACTION_PATH/check.sh"

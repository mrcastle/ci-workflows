name: scanners
description: Install one checksum-verified scanner binary; output the command that runs its wrapper script.

inputs:
  name:
    description: Scanner wrapper to run (osv, zizmor, gitleaks), i.e. <name>.sh next to this file.
    required: true
  bin:
    description: Binary name.
    required: true
  url:
    description: Release download URL (raw binary or .tar.gz).
    required: true
  sha256:
    description: Expected SHA256 of the download.
    required: true

outputs:
  command:
    description: Command for run-check. Doesn't touch GITHUB_PATH or GITHUB_ENV.
    value: ${{ steps.install.outputs.command }}

runs:
  using: composite
  steps:
    - id: install
      name: Install ${{ inputs.bin }}
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        BIN: ${{ inputs.bin }}
        URL: ${{ inputs.url }}
        SHA256: ${{ inputs.sha256 }}
        SCRIPTS: ${{ github.action_path }}
      run: |
        mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
        curl -fsSLo download "$URL"
        echo "$SHA256  download" | sha256sum -c -
        if [[ "$URL" == *.tar.gz ]]; then tar -xzf download -C bin "$BIN"; else mv download "bin/$BIN"; fi
        chmod +x "bin/$BIN"
        echo "command=PATH=\"$RUNNER_TEMP/bin:\$PATH\" bash \"$SCRIPTS/$NAME.sh\"" >> "$GITHUB_OUTPUT"

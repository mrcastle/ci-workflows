name: security
description: >-
  Run OSV-Scanner (vulnerable dependencies), zizmor (workflow security) and gitleaks (leaked
  secrets) from the repo root. Binaries are pinned by version + SHA256 here; Dependabot can't
  bump them (see README). gitleaks needs a full-history checkout (fetch-depth: 0).

runs:
  using: composite
  steps:
    - name: osv
      if: ${{ !cancelled() }}
      shell: bash
      env:
        NAME: osv
        RUN: bash "$SCRIPTS/osv.sh"
        TOOL_BIN: osv-scanner
        TOOL_URL: https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
        TOOL_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
        SCRIPTS: ${{ github.action_path }}
      run: bash "$SCRIPTS/../check/check.sh"

    - name: zizmor
      if: ${{ !cancelled() }}
      shell: bash
      env:
        NAME: zizmor
        RUN: bash "$SCRIPTS/zizmor.sh"
        TOOL_BIN: zizmor
        TOOL_URL: https://github.com/zizmorcore/zizmor/releases/download/v1.31.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
        TOOL_SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
        SCRIPTS: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }} # online audits
      run: bash "$SCRIPTS/../check/check.sh"

    - name: gitleaks
      if: ${{ !cancelled() }}
      shell: bash
      env:
        NAME: gitleaks
        RUN: bash "$SCRIPTS/gitleaks.sh"
        TOOL_BIN: gitleaks
        TOOL_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        TOOL_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        SCRIPTS: ${{ github.action_path }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: bash "$SCRIPTS/../check/check.sh"

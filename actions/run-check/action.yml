name: run-check
description: Run one check command. On failure, upload the tail of its output for the PR report.

inputs:
  name:
    description: Check name (also the report artifact name).
    required: true
  run:
    description: Command to run with bash.
    required: true
  working-directory:
    default: "."

runs:
  using: composite
  steps:
    - name: ${{ inputs.name }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NAME: ${{ inputs.name }}
        RUN: ${{ inputs.run }}
      run: |
        log="$RUNNER_TEMP/check.log" rc=0
        echo "\$ $RUN"
        bash -euo pipefail -c "$RUN" < /dev/null 2>&1 | tee "$log" || rc=$?
        if (( rc != 0 )); then
          mkdir -p "$RUNNER_TEMP/ci-report"
          {
            echo "<details><summary>❌ <b>$NAME</b> (exit $rc)</summary>"
            echo; echo '````'
            echo "\$ $RUN"
            tail -n 60 "$log" | sed 's/\x1b\[[0-9;?]*[A-Za-z]//g'
            echo '````'; echo "</details>"
          } > "$RUNNER_TEMP/ci-report/$NAME.md"
          echo "::error title=$NAME failed::exit $rc"
        fi
        exit "$rc"

    - if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-report-${{ inputs.name }}
        path: ${{ runner.temp }}/ci-report/
        retention-days: 1
        if-no-files-found: ignore

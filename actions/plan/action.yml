name: plan
description: 'Parse "name: command" lines into a JSON matrix of checks, one job per check.'

inputs:
  checks:
    description: 'One "name: command" per line. Blank lines and # comments are ignored.'
    required: true

outputs:
  checks:
    description: JSON array of {name, run}.
    value: ${{ steps.parse.outputs.checks }}

runs:
  using: composite
  steps:
    - id: parse
      shell: bash
      env:
        CHECKS: ${{ inputs.checks }}
      run: |
        json='[]'
        while IFS= read -r line; do
          [[ "$line" =~ ^[[:space:]]*(#|$) ]] && continue
          if [[ ! "$line" =~ ^[[:space:]]*([A-Za-z0-9_.-]+):[[:space:]]*(.+)$ ]]; then
            echo "::error::Invalid checks line (want \"name: command\"): $line"; exit 1
          fi
          json=$(jq -c --arg n "${BASH_REMATCH[1]}" --arg r "${BASH_REMATCH[2]}" '. + [{name: $n, run: $r}]' <<< "$json")
        done <<< "$CHECKS"
        # Names become job and artifact names, so they must be unique and not clash with security checks.
        bad=$(jq -r 'map(.name) | (group_by(.) | map(select(length > 1)[0])) + map(select(IN("osv", "zizmor", "gitleaks"))) | unique | join(", ")' <<< "$json")
        [[ -n "$bad" ]] && { echo "::error::Duplicate or reserved check names: $bad"; exit 1; }
        [[ "$json" == '[]' ]] && { echo "::error::No checks given"; exit 1; }
        echo "checks=$json" >> "$GITHUB_OUTPUT"
        jq -r '.[] | "\(.name): \(.run)"' <<< "$json"

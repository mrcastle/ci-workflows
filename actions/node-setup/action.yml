name: node-setup
description: Check out the repo and set up Node. With install, run the install once and upload node_modules; without, download that node_modules.

inputs:
  install:
    description: true in the install job only.
    default: "false"
  node-version:
    default: lts/*
  node-version-file:
    default: ""
  install-command:
    default: npm ci --ignore-scripts --no-audit --no-fund
  working-directory:
    default: "."

runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
        node-version-file: ${{ inputs.node-version-file != '' && format('{0}/{1}', inputs.working-directory, inputs.node-version-file) || '' }}

    # tar keeps the node_modules/.bin symlinks and executable bits, which a plain artifact upload loses.
    - name: Install
      if: inputs.install == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INSTALL: ${{ inputs.install-command }}
      run: |
        bash -euo pipefail -c "$INSTALL"
        mkdir -p node_modules # projects with no dependencies have none
        tar -czf "$RUNNER_TEMP/node_modules.tgz" node_modules

    - if: inputs.install == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: node_modules
        path: ${{ runner.temp }}/node_modules.tgz
        retention-days: 1
        compression-level: 0
        if-no-files-found: error

    - if: inputs.install != 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: node_modules
        path: ${{ runner.temp }}

    - name: Unpack node_modules
      if: inputs.install != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: tar -xzf "$RUNNER_TEMP/node_modules.tgz"

name: results
description: >-
  Collect the rows and failure details the check steps recorded, as outputs for the report job.
  A check that has a command but didn't run shows as skipped. Run with if always().

inputs:
  checks:
    description: The workflow's check names, space-separated, in report order.
    required: true
  commands:
    description: The workflow's inputs as JSON (toJSON(inputs)), to find which checks have a command.
    required: true
  setup:
    description: Outcome of the setup step (setup-node, the Rust toolchain). A failure adds a row, since the checks after it were skipped.
    default: success

outputs:
  rows:
    description: Markdown table rows, one per check.
    value: ${{ steps.collect.outputs.rows }}
  details:
    description: Markdown failure details for the checks that failed.
    value: ${{ steps.collect.outputs.details }}

runs:
  using: composite
  steps:
    - id: collect
      name: Collect results
      shell: bash
      env:
        CHECKS: ${{ inputs.checks }}
        COMMANDS: ${{ inputs.commands }}
        SETUP: ${{ inputs.setup }}
      run: bash "$GITHUB_ACTION_PATH/results.sh"
